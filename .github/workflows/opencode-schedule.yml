                  not just manifests), build-system changes (meson options
                  renamed, cmake minimum raised, new cargo --features),
                  new/renamed/removed install artifacts, CVE or security
                  mentions, deprecated APIs or flags, and changed asset layouts
                  (a release shipping only unexpected formats = HOLD or rework,
                  never a blind bump).
               b. READ upstream's own packaging hints: packaging/ and dist/
                  dirs, CI workflows, install docs, and the void-packages
                  template for the same upstream where one exists. If upstream
                  ships a unit file, completions, appstream metadata, or build
                  flags we lack, that is a packaging gap: close it or justify
                  it in the relay.
