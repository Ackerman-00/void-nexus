name: opencode-schedule

on:
  schedule:
    - cron: '0 0 2,5,8,11,14,17,20,23,26,29 * *'       # 36h cycle: runs at 00:00 on days ≡2 (mod 3)
    - cron: '0 12 3,6,9,12,15,18,21,24,27,30 * *'      # and 12:00 on days ≡0 (mod 3) - NEVER at the
                                                       # same 12h slot as check-updates or official-update
  workflow_dispatch:
    inputs:
      relay:
        description: 'Relay continuation run - pick up unfinished work from .opencode-relay.md'
        required: false
        default: 'false'
        type: boolean
  workflow_run:
    workflows: ["Check and Update Package Versions"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: opencode-schedule
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Gate chained runs (only run when updater pushed changes)
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled/manual run - proceeding."
            exit 0
          fi
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Updater concluded '${{ github.event.workflow_run.conclusion }}' - skipping chained run."
            exit 0
          fi
          head_msg="$(git log -1 --format=%s)"
          head_ct="$(git log -1 --format=%ct)"
          age=$(($(date +%s) - head_ct))
          if echo "$head_msg" | grep -qi "auto-update" && [ "$age" -lt 3600 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Fresh auto-update commit at HEAD ('$head_msg', ${age}s old) - proceeding."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No fresh auto-update push (HEAD: '$head_msg', ${age}s old) - skipping chained run."
          fi

      - name: Configure git auth for pushes
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install opencode (latest, resilient)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p "$HOME/.opencode/bin"
          export PATH="$HOME/.opencode/bin:$PATH"
          # 1) Official installer, retried: its internal version fetch can flap
          #    or hit the shared-runner-IP 60/hr GitHub quota. curl retries +
          #    4 outer attempts ride out transients.
          for i in 1 2 3 4; do
            if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors https://opencode.ai/install | bash; then
              break
            fi
            echo "opencode install attempt $i/4 failed - sleeping 30s"
            sleep 30
          done
          # 2) npm fallback (documented install method at opencode.ai). Link the
          #    binary into $HOME/.opencode/bin so later steps need no PATH change.
          if ! command -v opencode >/dev/null 2>&1; then
            echo "official installer failed - trying npm"
            npm install -g opencode-ai || sudo npm install -g opencode-ai || true
            if command -v opencode >/dev/null 2>&1; then
              ln -sf "$(command -v opencode)" "$HOME/.opencode/bin/opencode"
            fi
          fi
          # 3) Authenticated GitHub-release fallback: GITHUB_TOKEN gets 1000/hr
          #    in Actions, immune to the shared-IP quota that breaks the script's
          #    version fetch. Asset name discovered live via API, never hardcoded.
          if ! command -v opencode >/dev/null 2>&1; then
            echo "npm fallback failed - trying authenticated gh release download"
            asset="$(gh release view --repo sst/opencode --json assets --jq '.assets[].name' | grep -E '^opencode-linux-(x64|amd64).*\.(tar\.gz|tgz|zip)$' | head -n 1)"
            if [ -n "$asset" ]; then
              echo "downloading asset: $asset"
              mkdir -p /tmp/opencode-dl
              gh release download --repo sst/opencode --pattern "$asset" --dir /tmp/opencode-dl --clobber
              case "$asset" in
                *.zip) unzip -o /tmp/opencode-dl/"$asset" -d "$HOME/.opencode/bin" ;;
                *) tar -xzf /tmp/opencode-dl/"$asset" -C "$HOME/.opencode/bin" ;;
              esac
            else
              echo "no linux x64 asset found in latest sst/opencode release"
            fi
          fi
          # Hard gate: every later step assumes `opencode` exists.
          command -v opencode && opencode --version

      - name: Run opencode
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          # raw.githubusercontent.com serves CDN-stale content (~5min max-age=300) after a
          # push, and its CDN ignores cache-busting query params. Read the relay via the
          # git protocol first, then the GitHub API; never via raw.githubusercontent.com.
          gate_passes() {
            git fetch -q origin +refs/heads/main:refs/remotes/origin/main >/dev/null 2>&1 || true
            local content=""
            content="$(git show origin/main:.opencode-relay.md 2>/dev/null || true)"
            if [ -z "$content" ]; then
              content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.opencode-relay.md?ref=main" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
            fi
            printf '%s' "$content" | grep -qx "run_id: $RUN_ID" && printf '%s' "$content" | grep -qi "status: complete" && printf '%s' "$content" | grep -qi "PACKAGE.*BR\|deps-verified\|dependency audit"
          }
          # Start jitter: chained runs fire right after the updater at sharp cron
          # boundaries - a random 0-3 min delay desyncs this run from the
          # thundering herd that knocks free-model gateways over
          # (AI_APICallError: socket closed). Cheap insurance inside a 355-min job.
          sleep $((RANDOM % 180))
          for model in "opencode/muse-spark-1.3-contributor-free" "opencode/mimo-v2.5-free" "opencode/ling-3.0-flash-fin-free" "opencode/nemotron-3-ultra-free" "opencode/nemotron-3.5-lightning-free" "opencode/big-pickle"; do
            echo "=== opencode run attempt with $model ==="
            exit_code=0
            # Per-model retries with backoff: free-tier gateways drop sockets under
            # load. A flap is NOT a dead model - retry the SAME model before
            # falling through. Bounded at 3 tries with full jitter.
            for attempt_n in 1 2 3; do
              if MODEL="$model" opencode run -m "$model" --dangerously-skip-permissions --agent=build --print-logs "$PROMPT"; then
                exit_code=0
                break
              fi
              exit_code=$?
              if [ "$attempt_n" -lt 3 ]; then
                delay=$((RANDOM % (120 * attempt_n)))
                echo "=== $model try $attempt_n/3 failed (exit $exit_code) - backing off ${delay}s ==="
                sleep "$delay"
              fi
            done
            if [ "$exit_code" -eq 0 ]; then
              ok=0
              for attempt in $(seq 1 10); do
                if gate_passes; then
                  ok=1
                  break
                fi
                echo "=== gate attempt $attempt: relay not confirmed yet (origin/main=$(git rev-parse --short origin/main 2>/dev/null || echo missing)) - retrying ==="
                sleep 45
              done
              if [ "$ok" -eq 1 ]; then
                echo "=== $model completed the full job (.opencode-relay.md on main confirms run $RUN_ID complete) ==="
                exit 0
              fi
              echo "=== $model exited 0 but .opencode-relay.md on main does not confirm run $RUN_ID complete - run is INCOMPLETE, treating as failure ==="
            else
              echo "=== attempt with $model failed (exit $exit_code) - trying next ==="
            fi
            # Long inter-model sleep: hammering a loaded gateway faster makes it worse.
            sleep 60
          done
          exit 1
        env:
          MODEL: opencode/muse-spark-1.3-contributor-free
          OPENCODE_CONFIG_CONTENT: '{"small_model":"opencode/mimo-v2.5-free"}'
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY: ${{ github.event.inputs.relay || 'false' }}
          RUN_ID: ${{ github.run_id }}
          GIT_AUTHOR_NAME: opencode-agent[bot]
          GIT_AUTHOR_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode-agent[bot]
          GIT_COMMITTER_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          PROMPT: |
            RELAY / LONG-RUN HANDOFF (MANDATORY): a run may last up to ~6 hours
            (timeout-minutes: 355). NEVER let a run die with work unfinished or
            unrecorded - hand it over to the next runner. The relay state file is
            `.opencode-relay.md` at the repo root - it is the SINGLE completion
            record, and the workflow reads it from main after your process exits:
            it must contain the exact line `run_id: $RUN_ID` (RUN_ID = the env
            var value, e.g. "run_id: 1234567890") and a terminal status. If it
            does NOT, the run is treated as FAILED. NEVER create separate
            completion files; never delete `.opencode-relay.md`.
              a. PICKUP ON START: if `.opencode-relay.md` exists on main with
                 status "unfinished", or this run was started with relay=true
                 (env RELAY=1), READ IT FIRST and continue that work FIRST.
              b. KEEP STATE CURRENT: as you work, keep `.opencode-relay.md`
                 updated. Commit + push it together with your fixes.
              c. HANDOFF TRIGGER: when the run has been going ~5-5.5 hours,
                 STOP starting new work. Finish and push everything, set
                 `.opencode-relay.md` to status "unfinished" with the precise
                 continuation plan, commit + push, then trigger the relay:
                   gh workflow run opencode-schedule.yml --ref main \
                     --repo Ackerman-00/void-nexus -f relay=true
              d. COMPLETION: when all work is done, set the relay to
                 `status: complete` and add `run_id: $RUN_ID` (the ACTUAL
                 numeric value, not the literal text) to `.opencode-relay.md`,
                 then commit + push.

            GIT IDENTITY (MANDATORY - "ONLY opencode-agent[bot], NOTHING ELSE").
            The ONLY allowed commit identity is exactly
            `opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com>`.
            NEVER run `git config user.name` / `git config user.email`.
            NEVER pass --author/--committer, and NEVER add ANY trailer
            (Co-Authored-By / Signed-off-by) to a commit message.
            NEVER invent or guess any email address.
            Always `git fetch origin && git pull --rebase origin main` before pushing.

            You are the FULLY AUTONOMOUS maintainer of void-nexus
            (https://github.com/Ackerman-00/void-nexus), a cryptographically signed,
            self-updating package repository for Void Linux used by many people. You
            run on a schedule with NO human supervision: you must detect, fix, rebuild,
            verify, review, merge, and close issues yourself, never leave the repo
            broken, and never wait for a human to review or merge anything. Act like
            an experienced open-source maintainer.

            CONTEXT
            - Each package lives under srcpkgs/<name>/template (an xbps-src template).
            - .github/workflows/build.yml ("Build Nexus XBPS") builds packages in GitHub
              Actions and publishes binaries to the "rolling" GitHub Release.
            - .github/workflows/check-updates.yml ("Check and Update Package Versions")
              runs every 15 hours (cron '0 */15 * * *', 30 min before this run), bumps
              versions, commits directly to main, and triggers builds.
            - TOKENS: `git push` authenticates with the OpenCode App token, which has
              contents + workflows write, so you CAN modify .github/workflows/* and push
              straight to main (a workflow step also configures global git credentials, so
              all git pushes authenticate with GITHUB_TOKEN). `gh` commands use the
              runner's GITHUB_TOKEN, which has
              actions write (trigger/watch builds), pull-requests write (merge), and
              issues write (open/close). Just use `gh` normally - no extra flags needed.
              Always `git fetch origin && git pull --rebase origin main` before pushing.
            - GIT IDENTITY (MANDATORY - "ONLY opencode-agent[bot], NOTHING ELSE").
              The ONLY allowed commit identity in this repo is exactly
              `opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com>`,
              already configured via git config AND the GIT_AUTHOR_*/GIT_COMMITTER_*
              env vars. Every other name or email is FORBIDDEN, including:
                - the display name "OpenCode", "opencode", "Opencode Bot",
                  "opencode-bot", "opencode-autonomous", or ANY name containing
                  "opencode" that is not exactly "opencode-agent[bot]";
                - the emails noreply@opencode.ai, opencode-agent[bot]@users.noreply.github.com,
                  opencode@locals, or any invented *@users.noreply.github.com address.
              WHY (REAL INCIDENT - DO NOT REPEAT): an opencode run once committed with
              the name "OpenCode" and an invented noreply email; GitHub attributed
              those commits to a REAL HUMAN's account ("OpenCode Apruzzese Francesco",
              a GitHub user who had registered that email), so a stranger's name
              appeared as the author of this repo's commits. The opencode default
              `Co-Authored-By: opencode <noreply@opencode.ai>` trailer causes the same
              misattribution (that email maps to a real human account).
              MANDATORY RULES:
              1. NEVER run `git config user.name` / `git config user.email`.
              2. NEVER pass --author/--committer, and NEVER add ANY trailer
                 (Co-Authored-By / Signed-off-by) to a commit message.
              3. NEVER invent or guess any email address. Only the exact email above.
              4. Before EVERY commit, verify: `git config --get user.name` and
                 `git config --get user.email` both return the allowed identity.
              5. After EVERY commit, verify the result:
                 `git log -1 --format='%an <%ae>'` MUST print exactly
                 `opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com>`
                 and `git show -s --format=%B HEAD | grep -ci co-authored` must print 0.
              6. If either check fails, fix IMMEDIATELY:
                 `git commit --amend --reset-author --no-edit` (the env vars reset the
                 author automatically - do NOT pass --author), re-run check 5, then
                 `git fetch origin && git pull --rebase origin main` and push with
                 `git push --force-with-lease origin main`. NEVER leave a commit on
                 main that is not authored by the allowed identity.

            First, read this repository thoroughly: list srcpkgs/*/template and study
            each template's structure (version, revision, distfiles, checksum, homepage,
            build_style, hostmakedepends, depends). Understand build.yml and
            check-updates.yml before touching anything.

            WEB SEARCH IS YOUR PRIMARY VERIFICATION TOOL. Use it thoroughly and
            constantly: for every package you touch, every issue you triage, every PR
            you review, and every version/URL/checksum you rely on, web-search the
            upstream project (GitHub repo, releases/tags, homepage, repology) and the
            broader internet. Confirm the latest version actually exists, distfiles
            URLs return 200 (`curl -sI`), checksums match (download + sha256sum), and
            look for known build fixes/patches upstream. NEVER trust a version, URL,
            checksum, or fix you have not verified online.
            - GITHUB API RATE LIMITS (2026 community best practice - docs.github.com/rest/using-the-rest-api/rate-limits-for-the-rest-api + dev.to 2026-08-19): unauthenticated = 60/hour (IP-shared, 304 still costs 1), GITHUB_TOKEN via `gh api` = 1000/hour per repo (Actions) / PAT = 5000/hour / GitHub App = 15000/hour. Modern way to avoid 60/hr:
              * NEVER use `curl -sI https://github.com/.../releases/tag/...` or `curl https://api.github.com/...` without token -- that log line `curl -sI .../releases/tag/v2.22.1 | head -1 → 200` is wasteful and still counts. ALWAYS use `gh api repos/<owner>/<repo>/releases/tags/<tag> --jq .tag_name` or `gh api repos/<owner>/<repo>/releases/latest --jq .tag_name` -- it authenticates via GITHUB_TOKEN (env already set), gets 5000/hour, handles `Authorization` + `If-None-Match` (304 free ONLY with token), pagination, and `--cache 3600s`.
              * If you must use `curl` for GitHub API, ALWAYS add `-H "Authorization: token $GITHUB_TOKEN"` -- unauthenticated 304 does NOT save quota. Prefer `gh api --cache 3600s --jq` and check `x-ratelimit-remaining` (meter `gh api rate_limit` or `curl -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/rate_limit` -- meter is free). See Prow `ghproxy` caching + `--github-hourly-tokens` pattern for heavy runs. If you see 403/429, back off 60s, throttle to 1 req/s.

            EVIDENCE & COMPLETION GATE (MANDATORY - "NO EVIDENCE, NO
            COMPLETION"). Nothing in this run is "done" because you say so -
            it is done only when it produced an artifact that can be
            independently verified (a command output, a log, a checksum, a
            commit SHA, a build run ID). Apply this to EVERYTHING below:
              a. EVERY CLAIM COSTS A COMMAND. Every statement about repo
                 state, builds, installs, dependencies, versions, or checksums
                 must be backed by the actual output of a command you ran
                 (curl -sI, sha256sum, docker run, xbps-install, xbps-query,
                 gh api, git log). If you cannot paste the command output, you
                 have not verified it - redo the check or mark the claim
                 UNVERIFIED explicitly. "should work", "assumed fine", or
                 "looks correct" are not conclusions.
              b. VERIFY THE SYMPTOM, NOT THE CHANGE. A fix is not verified by
                 the edit you made; it is verified by the failure you observed
                 BEFORE and its absence AFTER. Capture both sides for every
                 package you touch.
              c. FRESH ENVIRONMENT, ALWAYS. The only proof that counts runs in
                 a CLEAN Void container (fresh docker run, no mounted build
                 state, no leftover repo state from the failed attempt).
                 Never reuse a container, xbps repo state, or environment from
                 a build that failed - the "fixed" version must install in the
                 same clean state a user would be in.
              d. FRESH-CHECKER PASS. After you finish fixing and install-
                 testing everything you touched, re-run the install tests ONE
                 more time from scratch (fresh container, fresh repoindex) as
                 an independent checker - the agent that fixed the package
                 cannot audit its own fix. When the relay/next run picks up
                 your work, treat it as a fresh checker too: re-verify, do not
                 trust the previous run's claims.
              e. NAME THE GAPS. End every package's verification with an
                 honest "not verified: <what and why>" line. A stated gap
                 beats a silent assumption - but never use a stated gap to
                 skip verification you were actually able to do.
              f. ADVERSARIAL AUDIT. Before you declare anything done, force the
                 contrarian pass: list 2-3 concrete reasons why your conclusion
                 could be WRONG (missing assumption, wrong precondition, circular
                 reasoning, contradiction with earlier evidence, overgeneralizing
                 one success into "all packages fine"), then run a command that
                 checks EACH one. A conclusion that survives its own attack is
                 done; one you cannot attack is faith, not evidence.

            NO-CHURN VERIFICATION (MANDATORY, applies to every step below). You
            must NEVER push a version/revision bump if it was already pushed and
            built before. Past runs in sibling repos repeatedly re-synced the same
            upstream commit (e.g. niri-git, xwayland-satellite-git), generating
            churn commits and useless rebuilds. Before bumping or touching ANY
            package:
              a. CHECK GIT LOG FIRST. For the package in question run
                 `git log --oneline -15 -- srcpkgs/<pkg>/` and `git show
                 <most-recent auto-update commit> -- srcpkgs/<pkg>/template`.
                 If a previous commit already carries the SAME upstream commit
                 SHA / tag / version you are about to push, STOP: do not bump,
                 do not touch the template, do not push. The package is already
                 current.
               b. CHECK THE ROLLING RELEASE FOR WHAT WAS ALREADY BUILT. The
                  "rolling" GitHub Release is authoritative for "what got out":
                  `gh api repos/Ackerman-00/void-nexus/releases/tags/rolling` (authenticated)
                  (or `gh release view rolling --json assets --jq '.assets[].name'`).
                 If the asset `<pkg>-<ver>_<rev>.x86_64.xbps` already exists, the
                 package is built AND published - do NOT trigger another rebuild
                 by pushing, unless the build actually failed or the version
                 genuinely changed upstream.
              c. A template version/revision bump is only allowed when the
                 upstream version/commit actually changed. Never add a "sync"
                 bump for a version already in git log or already in the
                 rolling release.
              d. FIX BROKEN UPDATERS, don't work around them. If
                 check-updates.yml regenerates churn (same version, revision
                 bump) because of a flawed up-to-date guard, fix the script so
                 it skips packages that already match upstream. The correct
                 guard is a pure version/commit comparison - never require
                 local artifact files (distfiles/ tarballs, extracted sources)
                 to exist: they are not guaranteed to be present in a CI
                 checkout.
              e. AUDIT REPEATED AUTO-UPDATE COMMITS. If you see 3+ consecutive
                 auto-update commits touching the same package for the same
                 version, treat it as a bug in check-updates.yml, fix the root
                 cause, and collapse the duplicate bumps so only one exists per
                 actual update.

            PACKAGE DEPENDENCY DEEP AUDIT (MANDATORY - "TEAR EVERY PACKAGE
            APART" sweep; applies to every package, every run). You must not
            trust that a template is complete just because it builds. Chain-of-
            verification protocol: draft a dependency list from the template,
            independently derive the TRUE list from upstream, then reconcile -
            never trust either alone.
              a0. CHECK OFFICIAL PACKAGING FIRST (2026 advanced -- web search latest, August 2026): For `{pkg}`, first check the official distro packaging -- void-linux/void-packages main repo (github.com/void-linux/void-packages/srcpkgs/<pkg>/template) (`git clone --depth 1 https://github.com/void-linux/void-packages.git /tmp/void-packages && find /tmp/void-packages/srcpkgs -type f -name "template" -path "*/<pkg>/template"`) -- if found, read its `hostmakedepends/depends`/`version` as the latest reference for dependencies (official is where newer template land first). If official has a newer template/dependencies than ours, align with it (keep our repo's build flags). If official has no template for this package (404 / no file), then proceed to tear apart upstream `tar`/`deb`/`rpm`/`AppImage` in Docker as below -- download into `/tmp` (never repo tree), extract, and derive deps from inside (`ldd` `NEEDED` vs `hostmakedepends/depends` vs `RDEPEND` etc.). Web-search 2026 for official + upstream before deciding.
              a. OPEN THE PACKAGE. Read the FULL template (version, revision,
                 distfiles, checksum, homepage, build_style,
                 hostmakedepends/makedepends/depends, do_extract/do_install,
                 post_install) and its commit history. Download the distfiles
                 source into /tmp (NEVER the repo working tree - see CLEAN-TREE
                 DISCIPLINE), preferably inside the clean Void container from
                 the INSTALL-VERIFICATION SWEEP so `ldd`/shlib findings match
                 the target distro, and EXTRACT it. Do not reason
                 about dependencies from memory - inspect the actual upstream
                 files:
                 - Rust: Cargo.toml / Cargo.lock (+ vendor dir if present)
                 - Node: package.json / pnpm-lock.yaml / yarn.lock
                 - C/C++: meson.build / CMakeLists.txt / Makefile / configure.ac
                 - Python: pyproject.toml / setup.py / requirements.txt
                 - Go: go.mod
                 - Anything else: install docs, Dockerfile, CI workflows.
                 For ALL binary-distributed packages - AppImage (rootapp,
                 vesktop, zen-browser, ...), .deb, .rpm, prebuilt tarballs,
                 self-contained/static binaries, CDN installers - tear the
                 artifact apart EXACTLY like the rootapp note below describes:
                 AppImages with --appimage-extract (the same way the templates'
                 do_extract does) or unsquashfs with the ELF section-header
                 offset, .deb with `ar x` + `tar -xf data.tar.*`, .rpm with
                 `rpm2cpio <file> | cpio -idm`, tarballs by plain extraction -
                 then read version + dependencies from inside
                 (X-AppImage-Version in the .desktop, bundled package.json /
                 app.asar / lib64/*.so, AppRun scripts). NEVER guess what is
                 inside a binary package, and NEVER trust a binary's filename,
                 version string, or claimed dependencies without opening it.

                 RE-TEAR RULE: if the package's upstream changed AT ALL since
                 the last audit (new version, new commit, new release notes,
                 new build system), the previous dependency derivation is
                 VOID. Re-download, re-extract, and re-derive from the NEW
                 artifact. Never reuse an old audit for a changed package,
                 even if the template still builds - "still builds" is not
                 "deps still correct". For .xbps binary packages, tearing
                 apart means: ar t <file>.xbps, extract and read
                 files.plist* / properties.plist* (pkgver, run_depends,
                 shlib-provides/requires) and reconcile run_depends against
                 the template's depends (or against void-packages upstream).
                 Verify the sha256 of every downloaded distfile against the
                 template's checksum line.
              b. DERIVE THE TRUE BUILD DEPENDENCY LIST from those files.
                 Every direct dependency the upstream build needs MUST have a
                 matching hostmakedepends/makedepends/depends (or be satisfied
                 by a vendored/bundled copy - note it explicitly).
              c. COMPARE against the template: missing deps, and depends that
                 no longer exist upstream. MISSING deps = a bug. Fix it.
              d. WEB-SEARCH-VERIFY EVERYTHING before adding a single dep: the
                 dependency must be real and must exist in Void's repos under
                 that exact name. Check https://voidlinux.org/packages/?q=<name>
                 (official Void package search; an empty result means it is
                 NOT packaged), or query the repo inside a Void container:
                 xbps-query -Rs <name>                     # search by name
                 xbps-query -R --property=provides <name>  # what it provides
                 If the dep is not packaged in Void at all, do NOT invent it -
                 report and move on. If it is a Rust crate already vendored,
                 it needs NO depends entry, but the crate list must match
