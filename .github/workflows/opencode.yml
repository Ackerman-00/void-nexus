name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Configure git auth for pushes
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install opencode (pinned)
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash -s -- -v 1.18.11

      - name: Run opencode
        shell: bash
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          for model in "opencode/deepseek-v4-flash-free" "opencode/mimo-v2.5-free" "opencode/laguna-s-2.1-free" "opencode/big-pickle"; do
            echo "=== opencode run attempt with $model ==="
            MODEL="$model" opencode github run && exit 0
            echo "=== attempt with $model failed (exit $?) - trying next ==="
            sleep 15
          done
          exit 1
        env:
          MODEL: opencode/deepseek-v4-flash-free
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}